# TEMPORARY (diag branch only, never merged): repeat the asyncio.run() teardown tests on the
# macOS runners with tracing, to see why a killed leader "survives" on Python 3.14.
name: diag-teardown

on:
  pull_request:

permissions:
  contents: read

jobs:
  repeat:
    if: github.head_ref == 'diag/macos-314-teardown'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        python: ["3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - name: Repeat the teardown tests 40 times with tracing
        env:
          PYTHONPATH: tests
        run: |
          failures=0
          for i in $(seq 1 40); do
            if ! uv run pytest -q -p no:cacheprovider -p _teardown_diag \
                tests/test_core_edges.py::test_asyncio_run_cancelling_reap_of_cancelled_run_still_kills \
                tests/test_process.py::test_asyncio_run_returning_mid_cleanup_still_kills \
                tests/test_process.py::test_async_cancel_during_timeout_cleanup_still_kills \
                > "run-$i.log" 2>&1; then
              failures=$((failures + 1))
              echo "::group::iteration $i FAILED"
              cat "run-$i.log"
              echo "::endgroup::"
            fi
          done
          echo "failures: $failures / 40"
          sysctl -n hw.ncpu machdep.cpu.brand_string || true

  full-suite:
    if: github.head_ref == 'diag/macos-314-teardown'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync
      - name: Download the latest qsv release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/qsv"
          gh release download --repo dathere/qsv --pattern "qsv-*-aarch64-apple-darwin.zip" --dir "$RUNNER_TEMP/qsv"
          unzip -o -q "$RUNNER_TEMP"/qsv/*.zip -d "$RUNNER_TEMP/qsv"
          chmod +x "$RUNNER_TEMP"/qsv/qsv*
      - name: The full suite, 3 times, with tracing
        env:
          PYTHONPATH: tests
        run: |
          failures=0
          for i in 1 2 3; do
            if ! QSV_BIN="$RUNNER_TEMP/qsv/qsv" uv run pytest -q -p no:cacheprovider -p _teardown_diag \
                > "suite-$i.log" 2>&1; then
              failures=$((failures + 1))
              echo "::group::suite run $i FAILED"
              grep -E "FAILED|DIAG|load average|killpg|_kill_now|_reap_async|_timeout_cleanup|_wait_dead|test start|^ *PID|^ *[0-9]+ +[0-9]+ +[0-9]+ " "suite-$i.log" || true
              tail -5 "suite-$i.log"
              echo "::endgroup::"
            fi
          done
          echo "failures: $failures / 3"
